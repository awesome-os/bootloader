name: CI — Awesome-OS Bootloader & UEFI GOP Splash

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-bootloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate deterministic 24-bit BMP splash assets
        run: node assets/generate-splash.mts
      - name: Run bootloader & splash asset unit tests
        run: node --test bootloader.test.mts
      - name: Compile & run C11 UEFI GOP / SimpleDRM splash blitter self-test
        run: |
          cc -std=c11 -Wall -Wextra -Werror uefi-gop-splash/holo_splash.c uefi-gop-splash/holo_splash_test.c -o /tmp/holo_splash_test
          /tmp/holo_splash_test
